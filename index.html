<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover habilita env(safe-area-inset-*) no iOS.
         O zoom permanece liberado: bloquear com user-scalable=no viola a
         diretriz de acessibilidade WCAG 1.4.4. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050811" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OmniFit" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="description" content="OmniFit PWA - Nutrição Científica, Treinamento Biomecânico & Termogênese Adaptativa" />
    <title>OmniFit - Performance & Nutrição Científica</title>

    <!-- Google Fonts: Outfit (Display), Plus Jakarta Sans (Corpo), JetBrains Mono (Dados) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#050811] text-slate-100 font-sans antialiased selection:bg-blue-500/30 selection:text-blue-200 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
