<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Gradiente Electric Lime -->
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84CC16" />
      <stop offset="50%" stop-color="#A3E635" />
      <stop offset="100%" stop-color="#4ADE80" />
    </linearGradient>

    <!-- Gradiente Metálico para a Barra Central -->
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Gradiente Escuro das Anilhas -->
    <linearGradient id="plateDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#090F1E" />
    </linearGradient>

    <!-- Brilho Neon de Fundo -->
    <radialGradient id="neonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#84CC16" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#84CC16" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#84CC16" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Fundo Obsidian com Cantos Arredondados PWA -->
  <rect width="512" height="512" rx="128" fill="#050811" />
  
  <!-- Borda Sutil de Vidro -->
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />
  
  <!-- Brilho Radial Central -->
  <circle cx="256" cy="256" r="200" fill="url(#neonGlow)" />

  <!-- ========================================================= -->
  <!-- HALTER DE ACADEMIA (DUMBBELL PRO)                         -->
  <!-- ========================================================= -->
  <g transform="translate(0, 0)">
    <!-- Barra Central de Pegada (Grip Bar) -->
    <rect x="180" y="240" width="152" height="32" rx="16" fill="url(#barGrad)" stroke="#090F1E" stroke-width="2" />
    
    <!-- Ranhuras / Serrilhado da Barra de Aço (Knurling) -->
    <line x1="210" y1="244" x2="210" y2="268" stroke="#475569" stroke-width="3" stroke-linecap="round" />
    <line x1="225" y1="244" x2="225" y2="268" stroke="#475569" stroke-width="3" stroke-linecap="round" />
    <line x1="240" y1="244" x2="240" y2="268" stroke="#475569" stroke-width="3" stroke-linecap="round" />
    <line x1="256" y1="244" x2="256" y2="268" stroke="#475569" stroke-width="3" stroke-linecap="round" />
    <line x1="272" y1="244" x2="272" y2="268" stroke="#475569" stroke-width="3" stroke-linecap="round" />
    <line x1="287" y1="244" x2="287" y2="268" stroke="#475569" stroke-width="3" stroke-linecap="round" />
    <line x1="302" y1="244" x2="302" y2="268" stroke="#475569" stroke-width="3" stroke-linecap="round" />

    <!-- Anéis de Trava / Colarinhos Internos -->
    <rect x="164" y="226" width="16" height="60" rx="8" fill="url(#limeGrad)" />
    <rect x="332" y="226" width="16" height="60" rx="8" fill="url(#limeGrad)" />

    <!-- LADO ESQUERDO: Anilhas de Peso -->
    <!-- Anilha Pequena Interna -->
    <rect x="136" y="176" width="24" height="160" rx="12" fill="url(#plateDark)" stroke="url(#limeGrad)" stroke-width="4" />
    <rect x="144" y="196" width="8" height="120" rx="4" fill="url(#limeGrad)" opacity="0.3" />

    <!-- Anilha Média Intermediária -->
    <rect x="104" y="152" width="28" height="208" rx="14" fill="url(#plateDark)" stroke="url(#limeGrad)" stroke-width="5" />
    <rect x="114" y="176" width="8" height="160" rx="4" fill="url(#limeGrad)" opacity="0.5" />

    <!-- Anilha Grande Externa -->
    <rect x="68" y="128" width="32" height="256" rx="16" fill="url(#plateDark)" stroke="url(#limeGrad)" stroke-width="6" />
    <rect x="80" y="160" width="8" height="192" rx="4" fill="url(#limeGrad)" />

    <!-- Ponta da Barra Esquerda -->
    <circle cx="68" cy="256" r="14" fill="url(#limeGrad)" />

    <!-- LADO DIREITO: Anilhas de Peso (Espelhado) -->
    <!-- Anilha Pequena Interna -->
    <rect x="352" y="176" width="24" height="160" rx="12" fill="url(#plateDark)" stroke="url(#limeGrad)" stroke-width="4" />
    <rect x="360" y="196" width="8" height="120" rx="4" fill="url(#limeGrad)" opacity="0.3" />

    <!-- Anilha Média Intermediária -->
    <rect x="380" y="152" width="28" height="208" rx="14" fill="url(#plateDark)" stroke="url(#limeGrad)" stroke-width="5" />
    <rect x="390" y="176" width="8" height="160" rx="4" fill="url(#limeGrad)" opacity="0.5" />

    <!-- Anilha Grande Externa -->
    <rect x="412" y="128" width="32" height="256" rx="16" fill="url(#plateDark)" stroke="url(#limeGrad)" stroke-width="6" />
    <rect x="424" y="160" width="8" height="192" rx="4" fill="url(#limeGrad)" />

    <!-- Ponta da Barra Direita -->
    <circle cx="444" cy="256" r="14" fill="url(#limeGrad)" />
  </g>
</svg>
