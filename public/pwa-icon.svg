<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84CC16" />
      <stop offset="100%" stop-color="#A3E635" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#84CC16" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#84CC16" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Deep Obsidian Background -->
  <rect width="512" height="512" rx="128" fill="#050811"/>
  
  <!-- Subtle Border & Glow -->
  <rect width="508" height="508" x="2" y="2" rx="126" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>
  <circle cx="256" cy="256" r="180" fill="url(#glow)" />

  <!-- Dumbbell / Biomechanics Icon in Electric Lime -->
  <g transform="translate(100, 100) scale(0.61)" fill="none" stroke="url(#limeGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Weight -->
    <rect x="70" y="160" width="60" height="192" rx="20" fill="#090F1E" stroke="url(#limeGrad)" stroke-width="28" />
    <rect x="130" y="196" width="30" height="120" rx="12" fill="#84CC16" />
    
    <!-- Central Bar -->
    <line x1="160" y1="256" x2="352" y2="256" stroke="url(#limeGrad)" stroke-width="36" />
    
    <!-- Right Weight -->
    <rect x="352" y="196" width="30" height="120" rx="12" fill="#84CC16" />
    <rect x="382" y="160" width="60" height="192" rx="20" fill="#090F1E" stroke="url(#limeGrad)" stroke-width="28" />
  </g>
</svg>
